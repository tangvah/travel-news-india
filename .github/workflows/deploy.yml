name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild of main as-is so date-based labels and month pages refresh.
    - cron: '35 18 * * *' # 18:35 UTC = 00:05 IST
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Build-time "today" (header date, footer year) in IST, matching the daily 00:05 IST rebuild.
          TZ: Asia/Kolkata
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    # PRs only build (as a check); deploys happen from main only (push, daily schedule, or manual run on main).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
